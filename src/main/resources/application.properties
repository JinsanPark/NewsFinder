spring.application.name=newsFinder

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/newsfinder
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

voyage.api-key=${VOYAGE_API_KEY}
voyage.model=voyage-4-lite

logging.level.org.jin.newsfinder.queryVector=DEBUG
logging.file.name=logs/measure.log

# application.properties는 ISO-8859-1로 읽혀 한글 깨짐. 피드 목록만 UTF-8로 따로 읽도록.
spring.config.import=classpath:rss-feeds.properties[encoding=utf-8]
