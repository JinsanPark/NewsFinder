<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div>

    <form method="get" action="/search">
        <input name="query">
        <button type="submit">검색</button>
    </form>

    <ul th:if="${results != null}">
    <li th:each="result : ${results}">

        <span th:text="${result.title}">제목</span>
        <span th:text="${result.summary}">요약</span>
        <span th:text="${result.score}">점수</span>
        <span th:text="${#temporals.format(result.publishedAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
        <a th:href="${result.url}">원본 링크</a>

    </li>
    </ul>
    <p th:if="${results != null and results.isEmpty()}">검색 결과가 없습니다.</p>
    <p th:if="${errorMessage}" th:text="${errorMessage}"></p>

</div>

</body>
</html>
